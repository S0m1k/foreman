[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
version = "0.1.0"
description = "AI-assisted consistency checking between construction drawings and specifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pymupdf>=1.24",
    "pillow>=11.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "ezdxf>=1.3",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]
ocr-tesseract = ["pytesseract>=0.3.13"]
ocr-paddle = ["paddleocr>=2.9", "paddlepaddle>=2.6"]

[tool.setuptools.packages.find]
where = [
    "packages/schemas",
    "packages/pdf",
    "packages/ocr",
    "packages/vision",
    "packages/extraction",
    "packages/matching",
    "packages/comparison",
    "packages/cad",
    "apps/api",
    "apps/worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
